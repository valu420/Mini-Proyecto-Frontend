<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskly - Change Password</title>
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
    <header>
        <div class="logo">
      <img src="assets/img/favicon.png" alt="Logo Taskly">
      <h1>Taskly</h1>
        </div>
    
    </header>

    <main class="recoverPassword">
        <h2>Change Password</h2>
        <form action="#" method="POST">
            <div>
                <div></div>
                <input type="password" id="new-password" name="new-password" required placeholder="ingresa tu nueva contraseña">
            </div>
            
            <div>
                <div></div>
                <input type="password" id="confirm-password" name="confirm-password" required placeholder="Confirma tu nueva contraseña">
            </div>
            <button type="submit" class="btn-primary">cambiar contraseña</button>
        </form>
    </main>

</body>
</html>
