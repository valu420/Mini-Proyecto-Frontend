<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taskly - Home</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Header -->
  <header>
    <div class="logo">
      <img src="assets/img/favicon.png" alt="Logo Taskly">
      <h1>Taskly</h1>
    </div>
    <button class="btn-secondary">Iniciar Sesión</button>
  </header>

  <!-- Hero -->
  <main class="hero">
    <div class="hero-text">
      <h2>Organiza tu día,<br> simplifica tu vida.</h2>
      <p>
        Únete a nuestra app y organiza tus tareas de forma simple, rápida y efectiva. 
        ¡Convierte tus pendientes en logros!
      </p>
      <button class="btn-primary">¡Comienza!</button>
    </div>
    <div class="hero-img">
      <img src="assets/img/ilustracion.png" alt="Ilustración Taskly">
    </div>
  </main>

  <!-- Footer -->
  <footer id="contacto">
    <p>© 2025 - Taskly</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
